name: JavaScript

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/javascript.yml"
      - "javascript/**"
      - "docs/playground/**"
      - "core/tests/data/taco_rumi.zip"
      - "core/tests/data/taco_nested.zip"
      - "core/tests/data/taco_cat/.tacocat/**"
      - "r/tests/testthat/data/taco.zip"
  pull_request:
    paths:
      - ".github/workflows/javascript.yml"
      - "javascript/**"
      - "docs/playground/**"
      - "core/tests/data/taco_rumi.zip"
      - "core/tests/data/taco_nested.zip"
      - "core/tests/data/taco_cat/.tacocat/**"
      - "r/tests/testthat/data/taco.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: npm package (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "24"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: javascript/package-lock.json

      - working-directory: javascript
        run: npm ci

      - working-directory: javascript
        run: npm run types

      - working-directory: javascript
        run: npm test

      - if: matrix.node == '24'
        working-directory: javascript
        run: npm run test:rumi

      - working-directory: javascript
        run: npm pack --dry-run
