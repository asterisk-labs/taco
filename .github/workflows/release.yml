name: Release

on:
  push:
    tags: ["v*", "libtaco-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
      javascript-version: ${{ steps.version.outputs.javascript }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - id: version
        name: Check package versions
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          root = Path.cwd()
          python = tomllib.loads((root / "python/pyproject.toml").read_text())["project"]["version"]
          julia = tomllib.loads((root / "julia/Project.toml").read_text())["version"]
          javascript = json.loads((root / "javascript/package.json").read_text())["version"]
          javascript_lock = json.loads((root / "javascript/package-lock.json").read_text())
          vcpkg = json.loads((root / "core/vcpkg.json").read_text())["version-string"]
          description = (root / "r/DESCRIPTION").read_text()
          r = re.search(r"^Version:\s*(\S+)", description, re.MULTILINE).group(1)
          configure = (root / "r/configure.ac").read_text()
          r_configure = re.search(r"AC_INIT\(\[taco\], \[([^]]+)\]\)", configure).group(1)
          cmake = (root / "core/CMakeLists.txt").read_text()
          core = re.search(r"project\(taco\s+VERSION\s+([0-9.]+)", cmake, re.MULTILINE).group(1)

          versions = {
              "core": core,
              "vcpkg": vcpkg,
              "python": python,
              "R": r,
              "R configure": r_configure,
              "Julia": julia,
              "JavaScript": javascript,
          }
          if len(set(versions.values())) != 1:
              raise SystemExit(f"package versions disagree: {versions}")
          version = python
          lock_versions = {
              javascript_lock["version"],
              javascript_lock["packages"][""]["version"],
          }
          if lock_versions != {javascript}:
              raise SystemExit(
                  f"JavaScript package and lock versions disagree: {javascript}, {lock_versions}"
              )
          tag = os.environ["GITHUB_REF_NAME"]
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              expected = f"libtaco-v{version}" if tag.startswith("libtaco-") else f"v{version}"
              if tag != expected:
                  raise SystemExit(f"tag {tag} does not match expected {expected}")
              if tag == f"v{version}":
                  import subprocess

                  native_tag = f"libtaco-v{version}"
                  comparison = subprocess.run(
                      ["git", "diff", "--quiet", native_tag, "HEAD", "--", "core", "extern/karu"]
                  )
                  if comparison.returncode != 0:
                      raise SystemExit(
                          f"core or extern/karu differs between {native_tag} and {tag}"
                      )
                  artifacts = (root / "julia/Artifacts.toml").read_text()
                  expected_url = f"releases/download/libtaco-v{version}/"
                  if artifacts.count("[[taco]]") != 5 or artifacts.count(expected_url) != 5:
                      raise SystemExit(
                          "the final package tag requires five Julia artifacts from "
                          f"libtaco-v{version}"
                      )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"value={version}", file=output)
              print(f"javascript={javascript}", file=output)
          PY

  build-lib:
    name: libtaco (${{ matrix.name }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            triplet: x64-linux
            library: libtaco.so
            shell: bash
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            triplet: arm64-linux
            library: libtaco.so
            shell: bash
          - name: macos-aarch64
            runner: macos-14
            container: ""
            triplet: arm64-osx
            library: libtaco.dylib
            shell: bash
          - name: macos-x86_64
            runner: macos-15-intel
            container: ""
            triplet: x64-osx
            library: libtaco.dylib
            shell: bash
          - name: windows-x86_64
            runner: windows-2022
            container: ""
            triplet: x64-windows-static-md
            library: taco.dll
            shell: pwsh
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
      VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.triplet }}
      MACOSX_DEPLOYMENT_TARGET: ${{ startsWith(matrix.name, 'macos-') && '11.0' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Install container build tools
        if: runner.os == 'Linux'
        run: |
          dnf install -y kernel-headers perl-core zip unzip
          git config --global --add safe.directory "$PWD"

      - name: Set release paths (Unix)
        if: runner.os != 'Windows'
        run: |
          echo "VCPKG_INSTALLED_DIR=$PWD/vcpkg_installed" >> "$GITHUB_ENV"
          echo "TACO_TRIPLETS_DIR=$PWD/core/triplets" >> "$GITHUB_ENV"

      - name: Set release paths (Windows)
        if: runner.os == 'Windows'
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_INSTALLED_DIR=$($PWD.Path)\vcpkg_installed"
          Add-Content -Path $env:GITHUB_ENV -Value "TACO_TRIPLETS_DIR=$($PWD.Path)\core\triplets"

      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: lukka/get-cmake@v4.4.2

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: vcpkg
          vcpkgGitCommitId: 9e44ec0e9f247d77c230ced0ee66c76296837807
          vcpkgJsonGlob: "**/core/vcpkg.json"
          runVcpkgInstall: true
          runVcpkgFormatString: '[`install`, `--recurse`, `--clean-after-build`, `--x-install-root`, `$[env.VCPKG_INSTALLED_DIR]`, `--triplet`, `$[env.VCPKG_DEFAULT_TRIPLET]`, `--overlay-triplets=triplets`]'
          doNotCache: false

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: cmake -S core -B core/build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=core/install -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" -DVCPKG_OVERLAY_TRIPLETS="$TACO_TRIPLETS_DIR" -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.MACOSX_DEPLOYMENT_TARGET }} -DTACO_BUILD_TESTS=ON -DTACO_WERROR=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S core -B core/build-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=core/install -DCMAKE_INSTALL_LIBDIR=lib "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} "-DVCPKG_INSTALLED_DIR=$env:VCPKG_INSTALLED_DIR" "-DVCPKG_OVERLAY_TRIPLETS=$env:TACO_TRIPLETS_DIR" -DTACO_BUILD_TESTS=ON -DTACO_WERROR=ON

      - run: cmake --build core/build-release --config Release --parallel
      - run: ctest --test-dir core/build-release -C Release --output-on-failure
      - run: cmake --install core/build-release --config Release

      - if: runner.os == 'Linux'
        name: Verify Linux dependencies
        run: |
          ldd core/install/lib/libtaco.so
          if ldd core/install/lib/libtaco.so | grep -E 'curl|ssl|crypto'; then
            echo "libtaco still depends on a build-environment crypto or curl library"
            exit 1
          fi

      - if: runner.os == 'macOS'
        name: Verify and sign macOS library
        run: |
          otool -L core/install/lib/libtaco.dylib
          if otool -L core/install/lib/libtaco.dylib | tail -n +2 | grep -E 'curl|ssl|crypto|/(opt/homebrew|usr/local|vcpkg)/'; then
            echo "libtaco still contains a build-environment library path"
            exit 1
          fi
          otool -l core/install/lib/libtaco.dylib | grep -A4 LC_BUILD_VERSION
          otool -l core/install/lib/libtaco.dylib | grep -A4 LC_BUILD_VERSION | grep -q 'minos 11.0'
          codesign --force --sign - core/install/lib/libtaco.dylib

      - if: runner.os == 'Windows'
        name: Verify Windows dependencies
        run: |
          $dependencies = (dumpbin /dependents core\install\bin\taco.dll | Out-String)
          $dependencies
          if ($dependencies -match 'libcurl|libssl|libcrypto') {
            throw "taco.dll still depends on a build-environment crypto or curl DLL"
          }

      - name: Stage artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staged
          cp core/install/lib/${{ matrix.library }} staged/
          cp core/include/taco/taco.h staged/
          cp python/LICENSE staged/LICENSE
          cp extern/karu/LICENSE staged/karu-LICENSE
          cp README.md staged/

      - name: Stage artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path staged | Out-Null
          Copy-Item core\install\bin\taco.dll staged\
          Copy-Item core\include\taco\taco.h staged\
          Copy-Item python\LICENSE staged\LICENSE
          Copy-Item extern\karu\LICENSE staged\karu-LICENSE
          Copy-Item README.md staged\

      - uses: actions/upload-artifact@v7
        with:
          name: libtaco-${{ matrix.name }}
          path: staged/
          if-no-files-found: error

  python-wheel:
    name: Python wheel (${{ matrix.name }})
    needs: build-lib
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            library: libtaco.so
            platform: manylinux_2_28_x86_64
            shell: bash
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            library: libtaco.so
            platform: manylinux_2_28_aarch64
            shell: bash
          - name: macos-aarch64
            runner: macos-14
            container: ""
            library: libtaco.dylib
            shell: bash
          - name: macos-x86_64
            runner: macos-15-intel
            container: ""
            library: libtaco.dylib
            shell: bash
          - name: windows-x86_64
            runner: windows-2022
            container: ""
            library: taco.dll
            shell: pwsh
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - if: runner.os == 'Linux'
        name: Select build Python
        run: |
          ln -sf /opt/python/cp312-cp312/bin/python3 /usr/local/bin/python
          ln -sf /opt/python/cp312-cp312/bin/pip /usr/local/bin/pip

      - if: runner.os != 'Linux'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip build hatchling cffi packaging wheel
      - if: runner.os == 'Linux'
        run: python -m pip install auditwheel
      - if: runner.os == 'macOS'
        run: python -m pip install delocate
      - if: runner.os == 'Windows'
        run: python -m pip install delvewheel

      - uses: actions/download-artifact@v8
        with:
          name: libtaco-${{ matrix.name }}
          path: libtaco-bin/

      - name: Bundle core (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p python/taco/_lib
          cp libtaco-bin/${{ matrix.library }} python/taco/_lib/

      - name: Bundle core (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path python\taco\_lib | Out-Null
          Copy-Item libtaco-bin\taco.dll python\taco\_lib\

      - working-directory: python
        run: python -m build --wheel --outdir ../wheelhouse-raw

      - if: runner.os == 'Linux'
        name: Repair Linux wheel
        run: |
          mkdir -p wheelhouse
          auditwheel repair wheelhouse-raw/*.whl --plat ${{ matrix.platform }} -w wheelhouse

      - if: runner.os == 'macOS'
        name: Repair macOS wheel
        run: |
          mkdir -p wheelhouse
          delocate-wheel -v -w wheelhouse wheelhouse-raw/*.whl

      - if: runner.os == 'Windows'
        name: Repair Windows wheel
        run: |
          New-Item -ItemType Directory -Force -Path wheelhouse | Out-Null
          delvewheel repair wheelhouse-raw\*.whl --wheel-dir wheelhouse

      - name: Test installed wheel (Unix)
        if: runner.os != 'Windows'
        run: |
          wheel="$(ls wheelhouse/*.whl | head -n 1)"
          python -m pip install "$wheel"
          cp core/tests/data/taco_flat.zip "${RUNNER_TEMP}/taco.zip"
          pushd "${RUNNER_TEMP}"
          python -c "import taco; table = taco.read('taco.zip'); assert table.num_rows > 0; print(taco.__version__)"
          python -c "import taco; table = taco.read('https://raw.githubusercontent.com/asterisk-labs/taco/${{ github.ref_name }}/core/tests/data/taco_flat.zip'); assert table.num_rows > 0"
          python -c "import sys, taco; taco.read('taco.zip'); loaded = {'cozip', 'numpy', 'pydantic', 'pyproj', 'shapely'} & set(sys.modules); assert not loaded, loaded"
          popd
          python -m pip install "${wheel}[writer]"
          python -c "import taco; assert callable(taco.open_writer); assert taco.metadata.sample.STAC"

      - name: Test installed wheel (Windows)
        if: runner.os == 'Windows'
        run: |
          $wheel = (Get-ChildItem wheelhouse\*.whl | Select-Object -First 1).FullName
          python -m pip install $wheel
          Copy-Item core\tests\data\taco_flat.zip "$env:RUNNER_TEMP\taco.zip"
          Push-Location $env:RUNNER_TEMP
          try {
            python -c "import taco; table = taco.read('taco.zip'); assert table.num_rows > 0; print(taco.__version__)"
            python -c "import taco; table = taco.read('https://raw.githubusercontent.com/asterisk-labs/taco/${{ github.ref_name }}/core/tests/data/taco_flat.zip'); assert table.num_rows > 0"
            python -c "import sys, taco; taco.read('taco.zip'); loaded = {'cozip', 'numpy', 'pydantic', 'pyproj', 'shapely'} & set(sys.modules); assert not loaded, loaded"
          } finally { Pop-Location }
          python -m pip install "$wheel[writer]"
          python -c "import taco; assert callable(taco.open_writer); assert taco.metadata.sample.STAC"

      - uses: actions/upload-artifact@v7
        with:
          name: python-wheel-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  python-sdist:
    name: Python sdist
    needs: validate
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev

      - name: Build and rebuild from the sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --sdist --outdir sdist-out python
          python -m twine check sdist-out/*
          python -m pip wheel --no-deps --wheel-dir sdist-wheel sdist-out/*.tar.gz
          python -m pip install sdist-wheel/*.whl
          cp core/tests/data/taco_flat.zip "${RUNNER_TEMP}/taco.zip"
          cd "${RUNNER_TEMP}"
          python -c "import taco; assert taco.read('taco.zip').num_rows > 0"

      - uses: actions/upload-artifact@v7
        with:
          name: python-sdist
          path: sdist-out/*.tar.gz
          if-no-files-found: error

  r-package:
    name: R package (${{ matrix.os }})
    needs: validate
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify vendored core
        run: |
          python tools/sync_r_core.py
          python -c "import subprocess; paths = ['r/src/vendor', 'r/src/taco_versions.h', 'r/inst/karu-LICENSE']; status = subprocess.check_output(['git', 'status', '--porcelain', '--', *paths], text=True); assert not status, status"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - if: runner.os == 'Linux'
        name: Install R check tools (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake devscripts

      - if: runner.os == 'macOS'
        name: Install R check tools (macOS)
        run: brew install autoconf automake checkbashisms

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'

  julia-package:
    name: Julia package (${{ matrix.name }})
    needs: build-lib
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            library: libtaco.so
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            library: libtaco.so
          - name: macos-aarch64
            runner: macos-14
            library: libtaco.dylib
          - name: macos-x86_64
            runner: macos-15-intel
            library: libtaco.dylib
          - name: windows-x86_64
            runner: windows-2022
            library: taco.dll
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"

      - uses: julia-actions/cache@v2

      - uses: actions/download-artifact@v8
        with:
          name: libtaco-${{ matrix.name }}
          path: libtaco-bin/

      - name: Select core (Unix)
        if: runner.os != 'Windows'
        run: echo "TACO_LIB=$(pwd)/libtaco-bin/${{ matrix.library }}" >> "$GITHUB_ENV"

      - name: Select core (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "TACO_LIB=$((Resolve-Path libtaco-bin\taco.dll).Path)"

      - run: julia --project=julia -e 'using Pkg; Pkg.instantiate(); Pkg.test()'

  javascript-package:
    name: npm package
    needs: validate
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: javascript/package-lock.json

      - working-directory: javascript
        run: npm ci

      - working-directory: javascript
        run: npm run types

      - working-directory: javascript
        run: npm test

      - working-directory: javascript
        run: npm pack --dry-run

  release-archives:
    name: Native release archives
    needs: [validate, build-lib]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/libtaco-v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: libtaco-*
          path: artifacts/

      - name: Build release archives
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          mkdir -p release-files staging
          for directory in artifacts/libtaco-*; do
            platform=$(basename "$directory" | sed 's/^libtaco-//')
            package="libtaco-${version}-${platform}"
            stage="staging/${package}"
            mkdir -p "$stage/include/taco"
            case "$platform" in
              windows-*)
                mkdir -p "$stage/bin"
                cp "$directory/taco.dll" "$stage/bin/"
                chmod 0755 "$stage/bin/taco.dll"
                ;;
              macos-*) mkdir -p "$stage/lib"; cp "$directory/libtaco.dylib" "$stage/lib/" ;;
              linux-*) mkdir -p "$stage/lib"; cp "$directory/libtaco.so" "$stage/lib/" ;;
            esac
            cp "$directory/taco.h" "$stage/include/taco/"
            cp "$directory/LICENSE" "$directory/karu-LICENSE" "$directory/README.md" "$stage/"
            tar czf "release-files/${package}.tar.gz" -C staging "$package"
            if [[ "$platform" == windows-* ]]; then
              (cd staging && zip -qr "../release-files/${package}.zip" "$package")
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: release-archives
          path: release-files/*
          if-no-files-found: error

  native-release:
    name: Native GitHub release
    needs: [validate, release-archives]
    if: startsWith(github.ref, 'refs/tags/libtaco-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-archives
          path: release-files/

      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          draft: false
          prerelease: true

  update-julia-artifacts:
    name: Update Julia artifacts
    needs: [validate, native-release]
    if: startsWith(github.ref, 'refs/tags/libtaco-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: taco-julia-artifacts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"

      - working-directory: julia
        run: |
          julia make-artifacts-toml.jl "${{ needs.validate.outputs.version }}" > Artifacts.toml.new
          mv Artifacts.toml.new Artifacts.toml

      - env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add julia/Artifacts.toml
          git diff --staged --quiet && exit 0
          git commit -m "update Julia artifacts for v${VERSION}"
          git pull --rebase origin main
          git push origin HEAD:main

  julia-artifact-smoke:
    name: Julia artifact smoke (${{ matrix.name }})
    needs: [julia-package]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
          - name: macos-aarch64
            runner: macos-14
          - name: macos-x86_64
            runner: macos-15-intel
          - name: windows-x86_64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"

      - uses: julia-actions/cache@v2

      - run: julia --project=julia -e 'using Pkg; Pkg.instantiate(); using Taco; @assert size(Taco.read("core/tests/data/taco_flat.zip"), 1) > 0'

  github-release:
    name: GitHub release
    needs: [validate, python-wheel, python-sdist, r-package, julia-package, javascript-package, julia-artifact-smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish-pypi:
    name: Publish to PyPI
    needs: [python-wheel, python-sdist, r-package, julia-package, javascript-package, github-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/taco-eo
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: python-wheel-*
          path: dist/
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: python-sdist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    name: Publish to npm
    needs: [python-wheel, python-sdist, r-package, julia-package, javascript-package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - working-directory: javascript
        run: npm ci

      - working-directory: javascript
        run: |
          package=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$package@$version" version >/dev/null 2>&1; then
            echo "$package@$version is already published; skipping npm publish"
            exit 0
          fi
          # Trusted publishing cannot move latest back to a lower version.
          latest=$(npm view "$package" dist-tags.latest 2>/dev/null || true)
          tag=latest
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$version" "$latest" | sort -V | tail -1)" != "$version" ]; then
            tag=next
          fi
          npm publish --access public --tag "$tag"
