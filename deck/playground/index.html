<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Sammy Carlos Romualdo">
  <meta name="description" content="Browse TACO fixture samples by STAC or ISTAC centroid.">
  <title>TACO viewer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    {
      "imports": {
        "hyparquet": "https://cdn.jsdelivr.net/npm/hyparquet@1.30.0/+esm",
        "hyparquet-compressors": "https://cdn.jsdelivr.net/npm/hyparquet-compressors@1.1.1/+esm"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../overview/" aria-label="TACO overview">
      <span class="brand-mark" aria-hidden="true">🌮</span>
      <span><strong>TACO</strong><small>viewer</small></span>
    </a>

    <div class="dataset-picker">
      <label>
        <span>Fixture</span>
        <select id="fixtureSelect" aria-label="TACO fixture">
          <option>Loading fixtures…</option>
        </select>
      </label>
      <button id="datasetMetadata" class="dataset-button" type="button" disabled>Dataset</button>
    </div>

    <div id="status" class="status"><i></i><span>Loading</span></div>
  </header>

  <main>
    <div id="map" aria-label="Map of TACO sample centroids"></div>

    <div class="legend" aria-label="Split legend">
      <span><i class="train"></i>train</span>
      <span><i class="validation"></i>validation</span>
      <span><i class="test"></i>test</span>
    </div>

    <div id="message" class="message" role="status" hidden></div>

    <aside id="metadataPanel" class="metadata-panel" aria-labelledby="pointTitle" aria-hidden="true">
      <header>
        <div><p id="pointPosition">Point —</p><h2 id="pointTitle">Sample metadata</h2></div>
        <button id="closeMetadata" class="icon-button" type="button" aria-label="Close metadata">×</button>
      </header>
      <div class="coordinates"><span>Centroid</span><strong id="pointCoordinates">—</strong></div>
      <nav id="metadataPath" class="metadata-path" aria-label="Metadata hierarchy"></nav>
      <div class="metadata-context">
        <strong id="metadataSource">—</strong>
        <span id="metadataCount">—</span>
      </div>
      <div id="metadataBody" class="metadata-body"></div>
    </aside>

    <div id="loading" class="loading" hidden>
      <div class="taco-loader" aria-hidden="true">
        <div class="loader-center"><span class="loader-taco">🌮</span><span class="loader-earth">🌍</span></div>
        <div class="loader-orbit"><span class="loader-satellite">🛰️</span></div>
      </div>
      <span>Reading TACO</span>
    </div>

    <a class="credit" href="https://asterisk.coop" target="_blank" rel="noopener">
      <span>Made with</span>
      <svg class="heart" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
      <span>by Asterisk Labs</span>
    </a>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
