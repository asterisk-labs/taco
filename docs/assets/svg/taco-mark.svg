<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="TACO">
<style>
text{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;text-anchor:middle;dominant-baseline:central}
.m{transform-box:view-box;transform-origin:50px 52px}
.taco{animation:taco 8s infinite}
.earth{animation:earth 8s infinite}
.orbit{transform-box:view-box;transform-origin:50px 50px;animation:spin 12s linear infinite}
.sat{transform-box:fill-box;transform-origin:center;animation:spin 12s linear infinite reverse}
@keyframes taco{0%,36%{opacity:1;transform:scale(1)}40%,90%{opacity:0;transform:scale(.4) rotate(-15deg)}95%,100%{opacity:1;transform:scale(1)}}
@keyframes earth{0%,36%{opacity:0;transform:scale(.4) rotate(15deg)}40%,90%{opacity:1;transform:scale(1)}95%,100%{opacity:0;transform:scale(.4) rotate(15deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.taco,.earth,.orbit,.sat{animation:none}.earth{opacity:0}}
</style>
<g class="m taco"><text x="50" y="52" font-size="52">🌮</text></g>
<g class="m earth"><text x="50" y="52" font-size="52">🌍</text></g>
<g class="orbit"><text class="sat" x="50" y="7" font-size="17">🛰️</text></g>
</svg>
