  <main id="view">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <p class="eyebrow">AI-ready Earth observation datasets</p>

        <h1 id="hero-title">One sample, <span class="hero-line"><span class="hero-highlight">one row</span>.</span></h1>

        <p class="hero-summary">
          Each sample keeps its files and metadata together under <strong class="hero-summary-highlight">one contract</strong>, so you filter by place, time or split before you read a file.
        </p>

        <div class="install" data-copy-root>
          <div class="install-command">
            <span class="prompt" aria-hidden="true">$</span>
            <code>pip install taco-eo</code>
            <button class="copy-command" type="button" data-copy="pip install taco-eo" aria-label="Copy the install command">
              <svg class="icon-copy" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8h10v10H8z"></path><path d="M6 15H4V4h11v2"></path></svg>
              <svg class="icon-check" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
              <span>Copy</span>
            </button>
          </div>
          <span class="copy-toast" aria-hidden="true">Copied</span>
          <p class="copy-feedback" aria-live="polite"></p>
        </div>
      </div>

      <figure class="flow" id="flow" data-label="Five public Earth observation datasets, drawn at random from 26, each stored its own way, pass through TACO and come out in one shape: rasters as Rumi files, tables as Parquet and JSON as JSON, one row per sample. Point at, tap or tab to a dataset to read its facts and its files in TACO."></figure>
    </section>
  </main>
