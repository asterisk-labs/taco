<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Sammy Carlos Romualdo">
  <meta name="description" content="Browse TACO samples by their spatial centroid.">
  <title>TACO viewer</title>
  <script>
    if (window.location.protocol === "file:") {
      window.location.replace(`http://127.0.0.1:8765/playground/${window.location.search}${window.location.hash}`);
    }
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.9.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="styles.css?v=46">
  <link rel="stylesheet" href="../shared/navigation.css">
  <script type="importmap">
    {
      "imports": {
        "hyparquet": "https://cdn.jsdelivr.net/npm/hyparquet@1.30.0/+esm",
        "hyparquet-compressors": "https://cdn.jsdelivr.net/npm/hyparquet-compressors@1.1.1/+esm"
      }
    }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand-group">
      <a class="brand" href="../" aria-label="TACO home">
        <span class="brand-mark" aria-hidden="true">🌮</span>
        <span><strong>TACO</strong><small>viewer</small></span>
      </a>
      <a class="taco-home-link" href="../" aria-label="Back to home" title="Back to home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5L12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M9.5 20v-6h5v6"/></svg>
        <span>Home</span>
      </a>
    </div>

    <div class="dataset-picker" aria-label="Open a TACO dataset">
      <div class="url-combobox">
        <select id="fixtureSelect" aria-label="Example TACO datasets">
          <option>Loading examples…</option>
        </select>
        <input id="datasetUrl" type="url" placeholder="https://example.com/dataset.zip" aria-label="TACO dataset URL" spellcheck="false">
      </div>
      <button id="loadDataset" class="dataset-button primary" type="button">Load</button>
    </div>

    <div id="status" class="status"><i></i><span>Loading</span></div>
  </header>

  <main>
    <div id="map" aria-label="Map of TACO sample centroids"></div>

    <aside id="sampleDisplay" class="sample-display" aria-live="polite" hidden>
      <div class="sample-display-heading">
        <div>
          <strong id="sampleDisplayPercent">—</strong>
          <span id="sampleDisplayCount">—</span>
        </div>
        <div class="sample-display-actions">
          <button id="decreasePoints" type="button" aria-label="Show fewer points">←</button>
          <button id="increasePoints" type="button" aria-label="Show more points">→</button>
        </div>
      </div>
      <progress id="sampleDisplayProgress" max="1" value="0"></progress>
      <small id="sampleDisplayHint">Random sample of the dataset</small>
    </aside>

    <div id="message" class="message" role="status" hidden></div>
    <aside id="plotPanel" class="plot-panel" aria-label="Point colors" hidden>
      <label for="plotField">Color points by</label>
      <select id="plotField" aria-label="Color points by metadata field">
        <option value="">Single color</option>
      </select>
      <select id="plotMode" aria-label="Interpret selected field as" hidden>
        <option value="auto">Auto</option>
        <option value="continuous">Continuous</option>
        <option value="categorical">Categorical</option>
      </select>
      <div id="plotLegend" class="plot-legend" aria-live="polite" hidden></div>
    </aside>

    <aside id="metadataPanel" class="metadata-panel" aria-labelledby="pointTitle" aria-hidden="true">
      <header>
        <div><p id="pointPosition">Point —</p><h2 id="pointTitle">Sample metadata</h2></div>
        <button id="closeMetadata" class="icon-button" type="button" aria-label="Close metadata">×</button>
      </header>
      <div class="coordinates"><span>Centroid</span><strong id="pointCoordinates">—</strong></div>
      <nav id="metadataPath" class="metadata-path" aria-label="Metadata hierarchy"></nav>
      <div class="metadata-context">
        <strong id="metadataSource">—</strong>
        <span id="metadataCount">—</span>
      </div>
      <div id="metadataBody" class="metadata-body"></div>
    </aside>

    <div id="loading" class="loading" hidden>
      <div class="taco-loader" aria-hidden="true">
        <div class="loader-center"><span class="loader-taco">🌮</span><span class="loader-earth">🌍</span></div>
        <div class="loader-orbit"><span class="loader-satellite">🛰️</span></div>
      </div>
      <span id="loadingLabel">Reading TACO</span>
      <div id="downloadProgress" class="download-progress" hidden>
        <div><span>sample.parquet</span><strong id="downloadPercent">0%</strong></div>
        <progress id="downloadBar" max="1" value="0"></progress>
        <small id="downloadBytes">0 B</small>
      </div>
    </div>

    <footer class="colophon">
      <span>Made with</span>
      <span class="heart" aria-label="love" role="img">♥</span>
      <span>by</span>
      <a class="by" href="https://asterisk.coop" target="_blank" rel="noopener noreferrer" aria-label="Asterisk Labs">
        <img src="asterisk-mark.svg" alt="Asterisk Labs">
      </a>
    </footer>
  </main>

  <script type="module" src="app.js?v=63"></script>
</body>
</html>
