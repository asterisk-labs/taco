[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "taco-eo"
version = "0.2.0"
description = "Build, read, consolidate and validate TACO v3 Earth Observation datasets (ZIP, FOLDER, TACOCAT)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Cesar Aybar", email = "cesar@asterisk.coop" },
]
keywords = [
    "earth-observation",
    "geospatial",
    "machine-learning",
    "cloud-optimized",
    "parquet",
    "taco",
    "cozip",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "cozip>=2026.9.4",
    "duckdb>=1.5.5",
    "pyarrow>=14",
]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.8"]

[project.urls]
Homepage = "https://asterisk.coop/taco"
Specification = "https://asterisk.coop/taco/spec"
Repository = "https://github.com/asterisk-labs/taco"
Issues = "https://github.com/asterisk-labs/taco/issues"

[tool.hatch.build.targets.wheel]
packages = ["taco"]

[tool.hatch.build.targets.sdist]
include = ["taco/**", "tests/**", "README.md", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF012", "SIM108"]

[tool.mypy]
files = ["taco"]
ignore_missing_imports = true

[tool.ruff.lint.isort]
known-first-party = ["taco"]
