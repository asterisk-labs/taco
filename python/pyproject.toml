[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "taco-eo"
version = "0.3.0"
description = "Build, read, consolidate and validate TACO v3 Earth Observation datasets (ZIP, FOLDER, TACOCAT)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Cesar Aybar", email = "cesar@asterisk.coop" },
]
keywords = [
    "earth-observation",
    "geospatial",
    "machine-learning",
    "cloud-optimized",
    "parquet",
    "taco",
    "cozip",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "cozip>=2026.9.4",
    "duckdb>=1.5.5",
    "numpy>=1.24",
    "pyarrow>=14",
    "pydantic>=2.8",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.8"]
geoenrich = ["earthengine-api>=1"]
progress = ["tqdm>=4.66"]

[project.urls]
Homepage = "https://asterisk.coop/taco"
Specification = "https://asterisk.coop/taco/spec"
Repository = "https://github.com/asterisk-labs/taco"
Issues = "https://github.com/asterisk-labs/taco/issues"

[tool.hatch.build.targets.wheel]
packages = ["taco"]

[tool.hatch.build.targets.sdist]
include = ["taco/**", "tests/**", "examples/**", "LICENSE", "README.md", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-config --strict-markers"
filterwarnings = ["error"]
xfail_strict = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PIE", "PT", "PTH", "RET", "SIM", "RUF"]
ignore = ["E501", "RUF012", "SIM108"]

[tool.mypy]
files = ["taco"]
strict = true

[[tool.mypy.overrides]]
module = "taco.cozip"
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["taco._view", "taco.tacocat", "taco.writer.levels"]
disable_error_code = ["no-untyped-call"]

[tool.coverage.run]
branch = true
source = ["taco"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff.lint.isort]
known-first-party = ["taco"]
