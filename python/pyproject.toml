[build-system]
requires = [
    "cmake>=3.21",
    "hatchling>=1.27",
    "ninja>=1.11",
    "packaging>=24",
]
build-backend = "hatchling.build"

[project]
name = "taco-eo"
version = "0.10.3"
description = "Python bindings to libtaco, the reference library for the TACO format."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Cesar Aybar", email = "cesar@asterisk.coop" },
]
keywords = [
    "earth-observation",
    "geospatial",
    "machine-learning",
    "cloud-optimized",
    "parquet",
    "taco",
    "cozip",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "cffi>=1.17",
    "cozip>=2026.9.4",
    "duckdb>=1.5.5",
    "numpy>=1.24",
    "tqdm>=4.66",
    "pyarrow>=14",
    "pydantic>=2.8",
    "pyproj>=3.6",
    "shapely>=2",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.8"]
test-eo = ["rumi-eo[write]>=0.19"]
geoenrich = ["earthengine-api>=1"]
rumi = ["rumi-eo[write]>=0.19"]

[project.urls]
Homepage = "https://asterisk.coop/taco"
Specification = "https://asterisk.coop/taco/spec"
Repository = "https://github.com/asterisk-labs/taco"
Issues = "https://github.com/asterisk-labs/taco/issues"

[tool.hatch.build.targets.wheel]
packages = ["taco"]
artifacts = ["taco/_lib/*"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["taco/**", "tests/**", "examples/**", "hatch_build.py", "LICENSE", "README.md", "pyproject.toml"]

[tool.hatch.build.targets.sdist.force-include]
"../core/CMakeLists.txt" = "native/core/CMakeLists.txt"
"../core/include" = "native/core/include"
"../core/src" = "native/core/src"
"../extern/karu/CMakeLists.txt" = "native/extern/karu/CMakeLists.txt"
"../extern/karu/VERSION" = "native/extern/karu/VERSION"
"../extern/karu/LICENSE" = "native/extern/karu/LICENSE"
"../extern/karu/cmake" = "native/extern/karu/cmake"
"../extern/karu/include" = "native/extern/karu/include"
"../extern/karu/src" = "native/extern/karu/src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-config --strict-markers"
filterwarnings = ["error"]
xfail_strict = true
markers = ["integration: exercises installed optional runtimes with real files"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PIE", "PT", "PTH", "RET", "SIM", "RUF"]
ignore = ["E501", "RUF012", "SIM108"]

[tool.mypy]
files = ["taco"]
strict = true

[[tool.mypy.overrides]]
module = "taco.container.cozip"
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "cffi", "shapely", "shapely.*", "tqdm", "tqdm.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["taco.container.view", "taco.metadata.derived", "taco.writer.catalog", "taco.writer.metadata"]
disable_error_code = ["no-untyped-call"]

[tool.coverage.run]
branch = true
source = ["taco"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff.lint.isort]
known-first-party = ["taco"]
